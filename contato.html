<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contato - Vakinha Faxinal-PR</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="Imagens Sobre/favicon.png" type="image/png">
</head>
<body class="page-shell">
  <header class="hero">
    <nav class="main-nav">
      <div class="nav-links">
        <a href="index.html">Início</a>
        <a href="apoio.html">Apoio</a>
        <a class="active" href="contato.html">Contato</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="section">
      <div class="content-card">
        <h2>Fale conosco</h2>
        <p>Deixe sua mensagem — se preferir, anexe um arquivo (jpg, png, pdf, docx).</p>

        <form id="contact-form" class="donation-form" novalidate>
          <div class="form-group">
            <label for="contact-name">Nome completo</label>
            <input id="contact-name" name="name" type="text" placeholder="Seu nome" />
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="contact-email">E-mail</label>
            <input id="contact-email" name="email" type="email" placeholder="seu@exemplo.com" />
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="contact-phone">Telefone (opcional)</label>
            <input id="contact-phone" name="phone" type="tel" placeholder="(DD) 9xxxx-xxxx" />
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="contact-message">Mensagem</label>
            <textarea id="contact-message" name="message" rows="5" placeholder="Escreva sua mensagem..."></textarea>
            <div class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="contact-attachment">Anexo (opcional)</label>
            <input id="contact-attachment" name="attachment" type="file" />
            <div class="error-message"></div>
          </div>

          <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
            <button type="submit" class="hero-button hero-button-primary">Enviar mensagem</button>
            <div class="form-success hidden">Mensagem enviada com sucesso!</div>
          </div>
        </form>
      </div>
    </section>
  </main>

    <footer class="site-footer">
      <img src="Imagens Sobre/SELO.png" alt="Selo Seguranca">
      <a href="https://www.instagram.com/porfaxinal/" target="_blank" rel="noopener noreferrer">
        <img class="social-insta" src="Imagens Sobre/instagram.png" alt="Instagram">
      </a>
      <p>Vakinha Faxinal PR © 2026</p>
    </footer>
  <script src="script.js"></script>  
</body>
</html>
